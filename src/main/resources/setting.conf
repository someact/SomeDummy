# ==============================================================================
#                     SOMEDUMMY ENTERPRISE CONFIGURATION
# ==============================================================================
# All text strings support Kyori Adventure MiniMessage formatting:
# https://docs.advntr.dev/minimessage/format.html
# Example: <gradient:#ff7675:#fab1a0>Text</gradient>, <gold><b>Bold Gold</b></gold>
# Unicode glyphs and Resource Pack custom fonts are fully supported!

general {
  # Silent startup in server console: if false, prints the SomeDummy banner on startup
  silent-startup = false

  # Allow non-admin players to summon dummies (/sd spawn, /sd add, or placing preset figurines)
  # When false, only operators/admins (somedummy.spawn permission) can summon dummies
  allow-player-spawn = false

  # Optional custom font namespace for GUI titles and text (leave empty for default)
  # Example: "minecraft:uniform" or "somedummy:gui"
  custom-ui-font = ""

  # Maximum number of target dummies a single player can have spawned simultaneously (0 for unlimited)
  max-dummies-per-player = 5
}

# ==============================================================================
#                 NORMAL PLAYER EDITOR PERMISSION RESTRICTIONS
# ==============================================================================
# Control which features non-admin players are allowed to customize on their dummies.
# Administrators (with somedummy.admin permission) always have full bypass.
player-editor-permissions {
  # Allow non-admin players to change the dummy entity type
  allow-change-type = false

  # Allow non-admin players to rename the dummy
  allow-rename = true

  # Allow non-admin players to customize dummy max health
  allow-custom-health = false

  # Allow non-admin players to toggle Infinite Health (DPS Mode)
  allow-toggle-infinite-health = true

  # Allow non-admin players to toggle AI (Frozen vs Active)
  allow-toggle-ai = false

  # Allow non-admin players to toggle Physics / Gravity modes
  allow-toggle-physics = false

  # Allow non-admin players to toggle Silent mode
  allow-toggle-silent = true

  # Allow non-admin players to toggle Auto-Respawn
  allow-toggle-respawn = false

  # Allow non-admin players to edit equipment items
  allow-edit-equipment = true

  # Allow non-admin players to change dummy lifespan duration
  allow-change-duration = false

  # Allow non-admin players to export dummy as placeable figurine item
  allow-export-preset = false

  # Allow non-admin players to toggle sunlight combustion
  allow-toggle-burn-in-sun = false

  # Allow non-admin players to teleport their dummy
  allow-teleport-dummy = true

  # Allow non-admin players to delete / remove their dummy
  allow-delete-dummy = true
}

wand {
  # Material of the dummy wand tool used to open the Dummy Editor GUI
  material = "STICK"

  # Require player to sneak (Shift) while right-clicking the dummy with the wand
  require-sneak = true
}

defaults {
  # Default entity type for newly spawned dummies (ZOMBIE, SKELETON, ARMOR_STAND, WARDEN, etc.)
  entity-type = "ZOMBIE"

  # Default display name template (<owner_name> placeholder is available)
  custom-name = "<gradient:#ff7675:#fab1a0><bold>Combat Target Dummy</bold></gradient>"

  # Default max health (hearts * 2)
  max-health = 1000.0

  # Infinite Health mode (Dummy takes damage and tracks DPS, but never dies)
  infinite-health = true

  # AI enabled (false = completely frozen in place, true = moves and acts like vanilla mob)
  has-ai = false

  # Physics & Gravity (true = falls with gravity, false = floats in mid-air)
  has-gravity = true

  # Silent mode (mutes ambient groans/sounds)
  is-silent = true

  # Auto-respawn at origin on defeat
  respawnable = true

  # Delay in seconds before respawning
  respawn-delay-seconds = 3

  # Lifespan duration in seconds (0 for permanent until removed)
  lifespan-seconds = 0

  # Allow undead mobs (Zombies, Skeletons, etc.) to catch fire under direct sunlight
  burn-in-sun = false

  # Static Hard Freeze mode (completely locked in 3D space - 0 gravity, 0 knockback, immobile statue)
  is-static = false
}

damage-indicator {
  # Master toggle for damage indicators and DPS tracking
  enabled = true

  # Spawn floating pop-up text displays above the dummy on hit
  show-floating-popups = true

  # Duration in server ticks for the floating pop-up before fading out (20 ticks = 1 second)
  popup-duration-ticks = 25

  # Max view distance in blocks for players to see the floating damage pop-ups
  popup-view-distance-blocks = 32

  # Display real-time DPS stats on the player's Actionbar when attacking
  show-actionbar-dps = true

  # Text format for normal floating hits
  # Placeholders: <damage>, <hearts>
  normal-hit-format = "<red>-<damage> ❤</red>"

  # Text format for critical floating hits
  # Placeholders: <damage>, <hearts>
  crit-hit-format = "<gold><bold>CRIT! -<damage> ❤</bold></gold>"

  # Format for the live Actionbar DPS summary
  # Placeholders: <damage>, <dps>, <total_damage>, <hits>, <dummy_name>
  actionbar-format = "<yellow><bold>✦ Target Hit ✦</bold></yellow> <gray>|</gray> <red>Last: -<damage> ❤</red> <gray>|</gray> <gold>DPS: <dps></gold> <gray>|</gray> <aqua>Total: <total_damage></aqua> <gray>(Hits: <hits>)</gray>"
}

sounds {
  # Master toggle to enable or disable all plugin sound effects
  enabled = true

  # Granular sound customization for every in-game event:
  dummy-spawn {
    sound = "ENTITY_EXPERIENCE_ORB_PICKUP"
    volume = 1.0
    pitch = 1.2
    enabled = true
  }

  dummy-hit {
    sound = "ENTITY_PLAYER_ATTACK_STRONG"
    volume = 0.8
    pitch = 1.0
    enabled = true
  }

  dummy-crit {
    sound = "ENTITY_PLAYER_ATTACK_CRIT"
    volume = 1.0
    pitch = 1.2
    enabled = true
  }

  dummy-die {
    sound = "ENTITY_ITEM_BREAK"
    volume = 1.0
    pitch = 0.8
    enabled = true
  }

  dummy-respawn {
    sound = "BLOCK_BEACON_ACTIVATE"
    volume = 1.0
    pitch = 1.5
    enabled = true
  }

  gui-click {
    sound = "UI_BUTTON_CLICK"
    volume = 0.8
    pitch = 1.0
    enabled = true
  }
}

messages {
  prefix = "<dark_gray>[<gradient:#ff7675:#fab1a0><bold>SomeDummy</bold></gradient>]</dark_gray> "
  dummy-spawned = "<green>Spawned target dummy <gold><name></gold> at <yellow><x>, <y>, <z></yellow>!</green>"
  dummy-removed = "<yellow>Target dummy removed.</yellow>"
  dummy-limit-reached = "<red>You have reached your maximum limit of <gold><max_dummies></gold> active dummies!</red>"
  preset-created = "<green>Saved dummy configuration into preset item: <gold><name></gold>!</green>"
  spawn-disabled = "<red>Normal players are not permitted to summon training dummies on this server.</red>"
  editor-locked = "<red>This dummy customization is locked by the server administrator.</red>"
  config-reloaded = "<green>SomeDummy configuration reloaded successfully!</green>"
  no-permission = "<red>You do not have permission to execute this command.</red>"
  name-prompt = "<yellow>Please enter the new dummy name in chat. Supports MiniMessage formatting. Type <red>cancel</red> to abort.</yellow>"
  health-prompt = "<yellow>Please enter the new max health in chat (e.g. <white>100</white>, <white>1000</white>, <white>5000</white>). Type <red>cancel</red> to abort.</yellow>"
  duration-prompt = "<yellow>Please enter lifespan duration in chat (e.g. <white>30m</white>, <white>1h</white>, or <white>0</white> for permanent). Type <red>cancel</red> to abort.</yellow>"
}
